services:
  postgres:
    image: postgres:16-alpine
    container_name: recruitment_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitment_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  qdrant:
    # Keep in step with the qdrant-client version installed in .venv
    image: qdrant/qdrant:v1.19.0
    container_name: recruitment_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Optional: the API can also run in Docker (by default we run it with Python on the PC, docs/USER_GUIDE.md).
  # The image builds the React interface too and serves it at http://localhost:8000.
  # Model and e-mail settings (LLM_PROVIDER, REMOTE_LLM_URL, EMAIL_MODE, SMTP_*...) come from .env.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_api
    restart: unless-stopped
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # inside Docker the database is the "postgres" service on its internal port (not 127.0.0.1:5433)
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: 5432
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      QDRANT_LOCATION: ""
      N8N_URL: http://n8n:5678
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./secrets:/app/secrets  # Google Calendar token (optional)
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # n8n orchestrator (diagram part 2). Workflows: n8n/workflows/ (import + activate: python scripts/n8n_setup.py).
  # They call the API at http://host.docker.internal:8000: start the API with --host 0.0.0.0.
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: recruitment_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Africa/Tunis
      - N8N_DIAGNOSTICS_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux; Docker Desktop already provides it
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro

  # Optional: browse the PostgreSQL tables in a web page (docs/reports/observe_the_data.md).
  # Start it with: docker compose --profile tools up -d adminer -> http://localhost:8080
  adminer:
    image: adminer:latest
    container_name: recruitment_adminer
    restart: unless-stopped
    profiles: ["tools"]
    depends_on:
      - postgres
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT:-8080}:8080"

volumes:
  postgres_data:
    driver: local
  qdrant_data:
    driver: local
  n8n_data:
    driver: local
