[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-ai"
version = "0.1.0"
description = "AI Recruitment Automation System - End-to-end CV processing, matching, and agentic recruiter assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Lead ML/AI Engineer", email = "engineer@example.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.1.0",
    "email-validator>=2.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
document-processing = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
]

ml = [
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "sentence-transformers>=2.6.0",
]

training = [
    "peft>=0.10.0",
    "trl>=0.8.0",
    "bitsandbytes>=0.43.0",
    "accelerate>=0.29.0",
]

vectorstore = [
    # Must stay within one minor version of the qdrant/qdrant image in docker-compose.yml
    "qdrant-client>=1.19.0,<1.20.0",
]

agents = [
    "langchain>=0.1.16",
    "langchain-core>=0.1.42",
    "langgraph>=0.0.39",
    "langchain-openai>=0.1.3",
]

api = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
]

database = [
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
]

frontend = [
    "streamlit>=1.33.0",
]

notebooks = [
    "ipykernel>=6.29.0",
    "matplotlib>=3.8.0",
]

dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.3.0",
    "black>=24.3.0",
    "mypy>=1.9.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
]

all = [
    "recruitment-ai[document-processing,ml,vectorstore,agents,api,database,frontend,notebooks,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
    ".venv",
    "notebooks",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4"]
ignore = ["E501", "B008", "UP046"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
